    <meta charset="UTF-8">

    <title>Recibo telefonico</title>
    <style>
        body{background:rgb(137, 229, 137); margin: 0 auto;}
        form{border: 2px solid black; width: fit-content; margin: 0 auto;}
        h1{text-align: center; text-shadow: -3px 4px 4px blue;}
        hr{height: 1px;}
        input,select{background: rgb(250, 250, 219); outline: none; border: none; 
            margin-top: 6px; margin-right: 6px; border-radius: 5px;}
        label{margin-right: 10px; margin-top: 3px;}
        input,select{transition: 0.5s ease;}
        input:hover{transform: scale(1.1);}
        select:hover{transform: scale(1.1);}
    </style>

<body>
    <hr color="black">
    <h1>Recibo telefonico</h1>
    <hr color="black">
    <form action="">
        <label for="minutos">Minutos de llamadas a celular: (1.00 c/u)</label>
        <input type="number" name="minutos" id="minutos" style="width: 50px;">
        <br>
        <hr color="black">
        <label for="plan">Tipo de plan:</label>
        <br>
        <label for="telefono">Solo telefono (200.00)</label><input type="radio" name="plan" id="plan" value="200">
        <br>
        <label for="tel_inter">Telefono + internet (450.00)</label> <input type="radio" name="plan" id="plan" value="450">
        <br>
        <label for="tel_inter_tv">Telefono + internet + TV (850.00)</label>
        <input type="radio" name="plan" id="plan" value="850">
        <br>
        <hr color="black">
        <label for="servicios">Otros servicios:</label>
        <br>
        <label for="antivirus">Antivirus (30.00)</label>
        <input type="checkbox" name="servicios" id="antivirus" value="30">
        <br>
        <label for="nube">Servicio de nube (50.00)</label>
        <input type="checkbox" name="servicios" id="nube" value="50">
        <br>
        <label for="web">Servicios web (40.00)</label>
        <input type="checkbox" name="servicios" id="web" value="40">
        <br>
        <hr color="black">
        <label for="paquetes">Paquetes:</label>
        <br>
        <select name="paquetes" id="paquetes">
        <option value="">Seleccionar una opcion</option>
        <option value="400">Residencial (400.00)</option>
        <option value="700">Ejecutivo (700.00)</option>
        <option value="300">Familiar(300.00)</option>
        <option value="400">Sin limites(400.00)</option>
        </select>
        <br>
        <hr color="black">
        <label for="monto">Total a pagar</label>
        <input type="text" name="" id="" readonly>
        <hr color="black">
        <input type="submit" value="calcular recibo" style="margin-bottom: 8px;" 
            onclick="calcularTotal()">
    </form>
    
    <script>

        function calcularTotal() {
            event.preventDefault(); /* Cancelar los eventos */
            // Let == var, var es antiguo y let es lo nuevo
            let minutos = document.getElementById("minutos");
            let plan = document.querySelector('input[name="plan"]:checked');
            let antivirus = document.getElementById("antivirus");
            let nube = document.getElementById("nube");
            let web = document.getElementById("web");
            var paquetes = document.querySelector('input[name="paquetes"]:checked');

        
            if( plan == null ){
                alert("Seleccione una opcion valida en plan")
            }
            console.log(plan.value);
            console.log(minutos.value);
            console.log(antivirus.checked);
            console.log(nube.checked);
            console.log(web.checked);
            console.log(paquetes.value);

            var total = minutos.value*1 + plan.value*1 + paquetes.value*1;


            if(antivirus.checked){
                total = total + antivirus.value*1
            }
            if(nube.checked){
                total = total + nube.value*1
            }
            if(web.checked){
                total = total + web.value*1
            }


            alert("Haz dado click en el boton Calcular")
            alert("Usted debe:" + total)
        }
